ruleset:
  name: pam
  rules:
  - id: 1
    fields:
      '[@metadata][IDMEFv2][target]': host
      '[Type][0]': Cyber
      '[Category][0]': Access.Authorized
      '[Analyzer][Data]': &id001
      - Log
      - Authentication
      '[Target][0][User]': '%{[Attachment][RawLog][Content][user][effective][name]}'
      '[Priority]': Info
      '[Description]': PAM session opened for user %{[Attachment][RawLog][Content][user][effective][name]} by %{[Attachment][RawLog][Content][user][name]}
  - id: 2
    fields:
      '[@metadata][IDMEFv2][source]': source
      '[@metadata][IDMEFv2][target]': host
      '[Type][0]': Cyber
      '[Category][0]': Access.Unauthorized
      '[Analyzer][Data]': *id001
      '[Target][0][User]': '%{[Attachment][RawLog][Content][user][name]}'
      '[Priority]': Medium
      '[Description]': PAM authentication failure for user %{[Attachment][RawLog][Content][user][name]} from %{[Attachment][RawLog][Content][source][address]}
  - id: 3
    fields:
      '[@metadata][IDMEFv2][target]': host
      '[Type][0]': Cyber
      '[Category][0]': Access.Unauthorized
      '[Analyzer][Data]': *id001
      '[Priority]': Low
      '[Description]': PAM authentication attempt for an unknown user
