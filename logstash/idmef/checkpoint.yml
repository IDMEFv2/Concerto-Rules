      '[Priority]': Info
      '[Description]': CheckPoint FW-1 accepted %{[Attachment][RawLog][Content][network][transport]} from %{[Attachment][RawLog][Content][source][address]} to %{[Attachment][RawLog][Content][destination][address]}:%{[Attachment][RawLog][Content][destination][port]}
