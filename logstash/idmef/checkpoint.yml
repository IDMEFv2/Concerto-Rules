ruleset:
  name: checkpoint
  rules:
  - id: 100
    fields:
      '[@metadata][IDMEFv2][source]': source
      '[@metadata][IDMEFv2][target]': host
      '[Type][0]': Cyber
      '[Category][0]': Access.Unauthorized
      '[Analyzer][Data]': &id001
      - Log
      - Network
      '[Target][0][IP]': '%{[Attachment][RawLog][Content][destination][address]}'
      '[Priority]': Low
      '[Description]': CheckPoint FW-1 dropped %{[Attachment][RawLog][Content][network][transport]} from %{[Attachment][RawLog][Content][source][address]} to %{[Attachment][RawLog][Content][destination][address]}:%{[Attachment][RawLog][Content][destination][port]}
