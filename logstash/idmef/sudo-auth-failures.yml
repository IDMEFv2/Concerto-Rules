ruleset:
  name: sudo-auth-failures
  rules:
    - id: 2702
      translate:
        - source: "[Attachment][RawLog][Content][target][user][name]"
          target: "[Priority]"
          dictionary:
            "root": "High"
          fallback: "Medium"
      fields:
        "[@metadata][IDMEFv2][target]": "host"
        "[Category][0]": "Access.Other"
        "[Analyzer][Data]":
          - "Log"
          - "Authentication"
        "[Type][0]": "Cyber"
        "[Target][0][Service]": "%{[Attachment][RawLog][Content][process][name]}"
        "[Target][0][User]": "%{[Attachment][RawLog][Content][target][user][name]}"
        "[Target][0][Hostname]": "%{[Attachment][RawLog][Content][host][hostname]}"
        "[Description]": "User %{[Attachment][RawLog][Content][related][user]} failed %{[Attachment][RawLog][Content][event][count]} sudo password attempts running '%{[Attachment][RawLog][Content][process][command_line]}' as %{[Attachment][RawLog][Content][target][user][effective][name]}"
